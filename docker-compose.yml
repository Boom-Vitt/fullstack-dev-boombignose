services:
  postgres:
    image: postgres:16
    container_name: ask-manual-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: askmanual
      POSTGRES_USER: askmanual
      POSTGRES_PASSWORD: askmanual
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmanual -d askmanual"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:


